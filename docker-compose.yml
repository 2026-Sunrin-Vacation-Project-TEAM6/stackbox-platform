services:
  db:
    image: postgres:16-alpine
    container_name: stackbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stackbox
      POSTGRES_PASSWORD: stackbox
      POSTGRES_DB: stackbox_db
    ports:
      - "5432:5432"
    volumes:
      - stackbox_pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackbox -d stackbox_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stackbox-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - stackbox_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  stackbox_pg_data:
  stackbox_redis_data:
