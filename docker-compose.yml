services:
  db:
    image: postgres:16-alpine
    container_name: stackbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - stackbox_pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: stackbox-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - stackbox_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stackbox-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      REDIS_STREAM_PREFIX: ${REDIS_STREAM_PREFIX}
      CODE_RUNNER_URL: http://code_runner:3001
      CODE_RUNNER_AUTH_TOKEN: ${CODE_RUNNER_AUTH_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      OPENAI_API_KEY: ${BACKEND_OPENAI_API_KEY}
      OPENAI_BASE_URL: ${BACKEND_OPENAI_BASE_URL}
      OPENAI_MODEL: ${BACKEND_OPENAI_MODEL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - sandbox

  web_worker:
    build:
      context: ./web_worker
      dockerfile: Dockerfile
      target: runtime
    container_name: stackbox-web-worker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_STREAM_PREFIX: ${REDIS_STREAM_PREFIX}
      REDIS_STREAM_GROUP: ${REDIS_STREAM_GROUP}
      REDIS_STREAM_CONSUMER: ${REDIS_STREAM_CONSUMER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - default

  code_runner:
    build:
      context: ./web_worker
      dockerfile: Dockerfile
      target: code_runner_runtime
    container_name: stackbox-code-runner
    restart: unless-stopped
    # No `ports:` mapping on purpose: code_runner executes arbitrary user
    # code and must only be reachable from other containers on the compose
    # network (i.e. backend), never directly from the host/internet. The
    # shared CODE_RUNNER_AUTH_TOKEN is defense-in-depth, not the only gate.
    #
    # Network isolation (per the Dockerfile's deployment note): code_runner
    # only joins the internal `sandbox` network, not `default`. That means
    # it can be reached by (and reply to) backend, but has no route to db,
    # redis, or the public internet — containing the blast radius of the
    # arbitrary user code it executes.
    expose:
      - "3001"
    environment:
      CODE_RUNNER_HOST: ${CODE_RUNNER_HOST}
      CODE_RUNNER_PORT: ${CODE_RUNNER_PORT}
      CODE_RUNNER_AUTH_TOKEN: ${CODE_RUNNER_AUTH_TOKEN}
    networks:
      - sandbox

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WORKER_URL: ${NEXT_PUBLIC_WORKER_URL}
    container_name: stackbox-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - web_worker
    networks:
      - default

  nginx:
    image: nginx:1.27-alpine
    container_name: stackbox-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    networks:
      - default

networks:
  default:
  sandbox:
    internal: true

volumes:
  stackbox_pg_data:
  stackbox_redis_data:
